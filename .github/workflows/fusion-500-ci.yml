name: FUSION 500 offline registry and policy tests
on:
  pull_request:
    paths:
      - 'src/imperial_plugins/fusion500*.py'
      - 'tests/test_fusion500.py'
      - 'manifests/fusion-500.json'
      - 'plugins/fusion-500/**'
      - 'docs/FUSION_500.md'
      - '.github/workflows/fusion-500-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/imperial_plugins/fusion500*.py'
      - 'tests/test_fusion500.py'
      - 'manifests/fusion-500.json'
      - 'plugins/fusion-500/**'
      - 'docs/FUSION_500.md'
      - '.github/workflows/fusion-500-ci.yml'
permissions:
  contents: read
jobs:
  offline-fusion500:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Offline tests
        env:
          PYTHONPATH: src
          IMPERIAL_OWNER_KILL_SWITCH: '1'
        run: python -m unittest discover -s tests -p 'test_fusion500.py' -v
      - name: Strict manifest and synthetic profile proof
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from imperial_plugins.core import validate_manifest
          from imperial_plugins.fusion500 import roster_proof
          manifest=json.loads(Path('manifests/fusion-500.json').read_text())
          assert validate_manifest(manifest)==manifest
          assert roster_proof()['profile_count']==500
          print('Deterministic roster verified; no provider execution')
          PY
