name: IMPERIAL Search Indexing MCP — protocol and source tests

on:
  pull_request:
    paths:
      - "src/imperial_plugins/indexing_mcp.py"
      - "src/imperial_plugins/search_console_read.py"
      - "src/imperial_plugins/search_console_submit.py"
      - "data/search-indexing-public.json"
      - "tools/search_indexing_mcp.py"
      - "tests/test_indexing_mcp.py"
      - "tests/test_search_console_read.py"
      - "tests/test_search_console_submit.py"
      - ".github/workflows/search-indexing-mcp.yml"
  push:
    branches: [main]
    paths:
      - "src/imperial_plugins/indexing_mcp.py"
      - "src/imperial_plugins/search_console_read.py"
      - "src/imperial_plugins/search_console_submit.py"
      - "data/search-indexing-public.json"
      - "tools/search_indexing_mcp.py"
      - "tests/test_indexing_mcp.py"
      - "tests/test_search_console_read.py"
      - "tests/test_search_console_submit.py"
      - ".github/workflows/search-indexing-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile MCP source, runner and tests
        run: python -m py_compile src/imperial_plugins/indexing_mcp.py src/imperial_plugins/search_console_read.py src/imperial_plugins/search_console_submit.py tools/search_indexing_mcp.py tests/test_indexing_mcp.py tests/test_search_console_read.py tests/test_search_console_submit.py
      - name: Run MCP offline protocol and adversarial tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_indexing_mcp.py' -v
      - name: Google Search Console read tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_search_console_read.py' -v
      - name: Google Search Console guarded submission tests (simulated)
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_search_console_submit.py' -v
      - name: Audit real published websites through MCP read-only verifier
        run: |
          PYTHONPATH=src python - <<'PY'
          from imperial_plugins.indexing_mcp import audit_public_site
          for site_id in ("founder", "company"):
              evidence = audit_public_site(site_id)
              assert evidence["public_http_audit"] == "PASS"
              assert evidence["checks"]["public_projects"] == 23
              assert evidence["google_indexed"] == "UNVERIFIED"
              print("PUBLIC HTTP PASS:", site_id,
                    evidence["checks"]["sitemap_url_count"], "sitemap URLs")
          print("BOUNDARY: not proof of Search Console ownership or Google indexing")
          PY
      - name: Verify no Google API credentials or write permissions are required
        run: |
          test -f data/search-indexing-public.json
          test -f docs/SEARCH_INDEXING_MCP.md
          ! grep -q '"name": "imperial.submit_google_indexing"' src/imperial_plugins/indexing_mcp.py
