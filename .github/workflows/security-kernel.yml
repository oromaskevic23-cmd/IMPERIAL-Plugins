name: Security Kernel CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python version
        run: python3 --version
      - name: Compile source
        run: python3 -m compileall -q src plugins
      - name: Kernel unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Legacy guardian tests
        run: python3 -m unittest discover -s plugins/guardian-policy -p 'test_*.py' -v
      - name: Legacy ledger tests
        run: python3 -m unittest discover -s plugins/audit-ledger -p 'test_*.py' -v
      - name: Manifest validation
        run: PYTHONPATH=src python3 tools/validate_manifests.py
