name: MOJON Enterprise Skills MCP — offline safety

on:
  push:
    branches: [main]
    paths:
      - 'src/imperial_plugins/mojon_mcp.py'
      - 'src/imperial_plugins/enterprise_skills.py'
      - 'src/imperial_plugins/core.py'
      - 'tools/mojon_mcp.py'
      - 'tests/test_mojon_mcp.py'
      - 'manifests/mojon.json'
      - 'plugins/mojon/**'
      - '.github/workflows/mojon-mcp.yml'
  pull_request:
    paths:
      - 'src/imperial_plugins/mojon_mcp.py'
      - 'src/imperial_plugins/enterprise_skills.py'
      - 'src/imperial_plugins/core.py'
      - 'tools/mojon_mcp.py'
      - 'tests/test_mojon_mcp.py'
      - 'manifests/mojon.json'
      - 'plugins/mojon/**'
      - '.github/workflows/mojon-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mojon-mcp-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile MOJON MCP source
        run: python3 -m py_compile src/imperial_plugins/mojon_mcp.py tools/mojon_mcp.py tests/test_mojon_mcp.py
      - name: Run adversarial MOJON unit and protocol tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_mojon_mcp.py' -v
      - name: Verify plugin manifest and all reviewed manifest contracts
        run: PYTHONPATH=src python3 tools/validate_manifests.py
      - name: Verify no remote connector, dynamic code execution or pricing execution
        run: |
          python3 - <<'PY'
          from imperial_plugins.mojon_mcp import TOOLS,status
          assert len(TOOLS)==5
          assert all(x["annotations"]["readOnlyHint"] is True for x in TOOLS)
          s=status()
          assert not s["hosted_mcp_deployed"]
          assert not s["execution_authorized"]
          assert not s["commercial_discount_policy_verified"]
          print("MOJON SOURCE CONTRACT PASS — read-only, no execution, no hosted deployment")
          PY
        env:
          PYTHONPATH: src
