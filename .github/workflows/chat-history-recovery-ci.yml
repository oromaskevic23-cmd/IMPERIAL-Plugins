name: IMPERIAL - Chat History Recovery Plugin (10-agent Search)

on:
  pull_request:
    paths:
      - 'src/imperial_plugins/chat_recovery.py'
      - 'tools/chat_history_recovery.py'
      - 'tests/test_chat_recovery.py'
      - 'manifests/chat-history-recovery.json'
      - '.github/workflows/chat-history-recovery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/imperial_plugins/chat_recovery.py'
      - 'tools/chat_history_recovery.py'
      - 'tests/test_chat_recovery.py'
      - 'manifests/chat-history-recovery.json'
      - '.github/workflows/chat-history-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-security:
    name: Export recovery tests + privacy guards / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile plugin source and tests
        run: python -m compileall -q src/imperial_plugins/chat_recovery.py tools/chat_history_recovery.py tests/test_chat_recovery.py
      - name: Execute 15 privacy and provenance cases on synthetic chat exports ONLY
        run: python -m unittest discover -s tests -p 'test_chat_recovery.py' -v
      - name: Validate all plugin manifests under actual kernel
        run: python tools/validate_manifests.py
      - name: Ensure real private source data is never bundled
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | python -c '
          import sys
          paths=[p.decode() for p in sys.stdin.buffer.read().split(b"\0") if p]
          bad=[p for p in paths if p.endswith((".sqlite", ".db")) or p.endswith("/conversations.json") or p=="conversations.json"]
          if bad:
              print("PRIVATE_CHAT_EXPORT_TRACKED_DENIED", file=sys.stderr)
              sys.exit(3)
          '; then
            echo "SYNTHETIC_TEST_ONLY_NO_CHAT_EXPORT_ATTACHED"
          else
            exit 3
          fi
